name: Cronus Infrastructure Production Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy-prod to confirm production deployment"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cronus-terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true

  ARM_CLIENT_ID: ${{ vars.AZURE_CI_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

jobs:
  apply-prod:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'deploy-prod'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: Terraform init
        working-directory: environments/prod
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: environments/prod
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: environments/prod
        run: terraform apply -input=false tfplan